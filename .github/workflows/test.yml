name: Test Topic Fetcher

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: |
          python - <<'PY'
          from topic_fetcher import DESK_PILLS, DESKS, GENRES, fetch_topics

          regional = fetch_topics("Cricket — India / Pakistan / Sri Lanka / Asia")
          regional = {item["topic"]: item for item in regional}
          assert {"India", "Pakistan", "Sri Lanka"} <= set(regional)
          assert len(regional["Pakistan"]["headlines"]) >= 5
          assert len(regional["Sri Lanka"]["headlines"]) >= 5

          print("\nIndia cricket stories returned:")
          for headline in regional["India"]["headlines"]:
              print(f"- {headline['title']} | {headline['publisher']} | {headline['published_at']}")

          niche = fetch_topics("Niche Sports — Global")
          assert len(niche) >= 5
          assert all(item["topic"] in GENRES["Niche Sports — Global"] for item in niche)
          assert all(item["topic"] != "Cricket" for item in niche)

          for desk in ("News", "Technology"):
              stories = fetch_topics(desk)
              assert stories
              assert all(item["topic"] in DESK_PILLS[desk] for item in stories)

          assert set(DESKS) == {"Sports", "News", "Entertainment", "Technology", "Business & Finance", "Gaming", "Science & Space"}
          PY
